name: Build Disha Browser APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "DishaBrowser-v1.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DishaBrowser-APK
          path: DishaBrowser-v*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Disha Browser v1.1.${{ github.run_number }}
          body: "दिशा ब्राउज़र का नया वर्ज़न। नीचे दी गई APK फ़ाइल डाउनलोड करके इंस्टॉल करें।"
          files: DishaBrowser-v*.apk
